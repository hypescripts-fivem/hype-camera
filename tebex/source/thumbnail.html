<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --card: #111111;
    --line: rgba(255,255,255,.10);
    --text: #ffffff;
    --muted: #a1a1a1;
    --accent: #4ade80;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; background: var(--bg); overflow: hidden; }
  body { font-family: "Plus Jakarta Sans", sans-serif; color: var(--text); position: relative; }

  /* arka plan: ince grid + yumuşak ışık */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse 70% 80% at 70% 45%, #000 20%, transparent 75%);
  }
  .glow {
    position: absolute; width: 1300px; height: 1000px; right: -260px; top: -120px;
    background: radial-gradient(closest-side, rgba(255,255,255,.08), transparent);
  }
  .glow-accent {
    position: absolute; width: 900px; height: 700px; right: 80px; bottom: -300px;
    background: radial-gradient(closest-side, rgba(74,222,128,.13), transparent);
  }

  /* sol kolon */
  .left { position: absolute; left: 112px; top: 96px; bottom: 96px; width: 880px; display: flex; flex-direction: column; z-index: 5; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { width: 46px; height: 48px; }
  .brand .name { font-size: 30px; font-weight: 700; letter-spacing: -.01em; }
  .brand .sep { width: 1px; height: 30px; background: var(--line); }
  .brand .tag { font-size: 24px; color: var(--muted); font-weight: 500; }

  .pill {
    margin-top: auto; align-self: flex-start;
    display: inline-flex; align-items: center; gap: 14px;
    padding: 12px 22px; border-radius: 999px;
    border: 1px solid var(--line); background: #121212;
    font-size: 24px; font-weight: 600; color: #e5e5e5;
  }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 6px rgba(74,222,128,.18), 0 0 18px rgba(74,222,128,.8); }

  h1 { margin-top: 30px; font-size: 138px; white-space: nowrap; line-height: .94; font-weight: 800; letter-spacing: -.05em; }
  h1 .soft { display: block; padding-bottom: .26em; margin-bottom: -.26em; background: linear-gradient(180deg, #ffffff 0%, #8f8f8f 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin-top: 30px; font-size: 32px; line-height: 1.4; color: var(--muted); font-weight: 500; max-width: 700px; }

  .chips { margin-top: 44px; display: flex; gap: 14px; flex-wrap: wrap; }
  .chip {
    padding: 14px 24px; border-radius: 14px; border: 1px solid var(--line); background: var(--card);
    font-size: 24px; font-weight: 600; color: #ededed;
  }
  .chip.solid { background: #fff; color: #0a0a0a; border-color: #fff; }

  /* sağ: ekran görüntüsü kompozisyonu (pnpm dev, tarayıcı önizlemesi) */
  .stage { position: absolute; inset: 0; perspective: 2200px; z-index: 2; }
  .shot {
    position: absolute; border-radius: 18px; overflow: hidden;
    border: 1px solid rgba(255,255,255,.14);
    background-repeat: no-repeat;
    box-shadow: 0 50px 120px rgba(0,0,0,.75), 0 0 0 1px rgba(0,0,0,.6);
    transform-style: preserve-3d;
  }
  /* kamera listesi: 01-menu-all içinden 273,124 → 1648,955 (1375x831) */
  .menu {
    width: 1375px; height: 831px;
    background-image: url("01-menu-all.png");
    background-position: -273px -124px;
    left: 900px; top: 140px;
    transform-origin: left center;
    transform: rotateY(-16deg) rotateX(3deg) scale(.86);
  }
  /* yüz tanıma paneli: 4x çözünürlükte element ekran görüntüsü (369x236 css px), şeffaf köşeler */
  .face-wrap { position: absolute; z-index: 4; left: 960px; top: 615px; filter: drop-shadow(0 40px 60px rgba(0,0,0,.9)); }
  .face {
    width: 590px; height: 377px;
    background: url("face-panel@4x.png") no-repeat center / 100% 100%, #0b0e0d;
    clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 22px 100%, 0 calc(100% - 22px));
  }

  .fade-right { position: absolute; right: 0; top: 0; bottom: 0; width: 160px; background: linear-gradient(90deg, transparent, var(--bg)); z-index: 3; }
  .fade-left { position: absolute; left: 0; top: 0; bottom: 0; width: 980px; background: linear-gradient(90deg, var(--bg) 62%, rgba(10,10,10,.85) 80%, transparent); z-index: 3; }

  .badge {
    position: absolute; right: 64px; top: 56px; z-index: 6;
    display: flex; align-items: center; gap: 12px;
    font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 26px; letter-spacing: .14em; color: #fff;
    padding: 10px 18px; border-radius: 12px; border: 1px solid var(--line); background: rgba(10,10,10,.75);
  }
  .badge .dot { width: 12px; height: 12px; background: #ff3b30; box-shadow: 0 0 14px rgba(255,59,48,.9); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="glow-accent"></div>

  <div class="stage">
    <div class="shot menu"></div>
  </div>
  <div class="face-wrap"><div class="face"></div></div>
  <div class="fade-left"></div>
  <div class="fade-right"></div>

  <div class="badge"><span class="dot"></span>CCTV</div>

  <div class="left">
    <div class="brand">
      <img src="logo.svg" alt="">
      <span class="name">HypeScripts</span>
      <span class="sep"></span>
      <span class="tag">FiveM Script</span>
    </div>

    <div class="pill"><span class="dot"></span>Law Enforcement</div>
    <h1>Security<span class="soft">Cameras</span></h1>
    <p class="sub">Watch bank &amp; store cameras live and identify suspects with face recognition.</p>

    <div class="chips">
      <span class="chip solid">Face Recognition</span>
      <span class="chip">37 Cameras</span>
      <span class="chip">ESX · QB · QBX</span>
    </div>
  </div>
</body>
</html>
